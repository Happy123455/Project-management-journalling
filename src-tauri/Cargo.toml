[package]
name = "dynamic-journal"
version = "0.1.0"
description = "Dynamic Journal: a local-first block journal"
authors = ["Hapi"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dynamic_journal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
# The direct Wi-Fi link (both devices) and, on the Mac, the MCP server for Claude Desktop.
tiny_http = "0.12"

# The AI key lives in the macOS Keychain (Android uses the Keystore from MainActivity).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Read aloud with Kokoro on the Mac: sherpa-onnx, model download/unpack, playback.
sherpa-onnx = "=1.13.8"
ureq = "3"
bzip2 = "0.5"
tar = "0.4"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
# The Mac floating bubble's global shortcut.
tauri-plugin-global-shortcut = "2"

# The shared clipboard asks macOS whether anything was copied (a number) before reading it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: a panic inside one background task (an async command, a plugin, a media
# request) used to take the whole Mac app down ("quit unexpectedly", about once an hour).
panic = "unwind"
# Keep function names so a crash report says where it happened.
strip = "debuginfo"
